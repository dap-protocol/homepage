<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="description" content="Dap is a decentralized naming system and certificate authority. It aims to be the secure DNS upgradfe for everyone."/>
    <meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width"/>

    <title>Dap.sh &middot; The DNS upgrade for everyone</title>

    <style>
      *,
      *::before,
      *::after {
        margin: 0; padding: 0;
        box-sizing: inherit;
      }

      html,
      body {
        width: 100%; height: 100%;
      }

      html {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: flex;
        font-family: system-ui;
        justify-content: center;
        flex-direction: column;
        font-size: 12px;
        padding-left: 2rem;
        padding-right: 2rem;
      }

      figure {
        text-align: center;
        transform: translateY(-2rem);
      }

      img {
        max-width: 500px;
        width: 100%;
      }

      figcaption {
        font-size: 2rem;
        line-height: 1;
      }

      a {
        font-size: 1rem;
        letter-spacing: 0.05rem;
        text-transform: uppercase;
        transition: color 0.2s;;
      }

      a:not(:hover) {
        color: oklch(62.39% 0.181 258.33);
      }

      a:hover {
        color: oklch(58.47% 0.181 302.06);
      }
    </style>
  </head>

  <body>
    <figure>
      <img alt="dap illustration" src="./logo.png"/>
      <figcaption>Secure Foundation for the Internet</figcaption>
    </figure>

    <a href="./whitepaper.html">Whitepaper</a>
    <a href="https://github.com/dap-sh">Github</a>
  </body>
</html>
